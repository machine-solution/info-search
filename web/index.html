<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Engine</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <strong>Search Engine</strong>
    <div class="engine-state" id="engine-state">
      <span class="state-dot" aria-hidden="true"></span>
      <span id="engine-state-text">Подключение к индексу…</span>
    </div>
  </header>

  <main>
    <form class="search-form" id="search-form">
      <div class="query-control">
        <label for="query-input">Запрос</label>
        <input id="query-input" name="query" type="search" autocomplete="off"
               spellcheck="false" placeholder="artificial AND (intelligence OR learning)"
               required autofocus>
      </div>
      <div class="limit-control">
        <label for="limit-input">На странице</label>
        <input id="limit-input" name="page_size" type="number" min="1" max="1000" value="10">
      </div>
      <button class="search-button" type="submit">Найти</button>
    </form>

    <div class="feedback error" id="error-box" role="alert" hidden></div>

    <section class="workspace" aria-label="Результаты и дерево запроса">
      <div class="results-panel">
        <div class="section-heading">
          <h1>Результаты</h1>
          <p id="result-summary" aria-live="polite">Запрос ещё не выполнялся</p>
        </div>
        <div id="results" class="results-list">
          <div class="empty-state">Введите запрос и нажмите «Найти»</div>
        </div>
        <nav class="pagination" id="pagination" aria-label="Страницы результатов" hidden>
          <button type="button" id="previous-page">Назад</button>
          <span id="page-number">Страница 1</span>
          <button type="button" id="next-page">Дальше</button>
        </nav>
      </div>

      <aside class="tree-panel" aria-labelledby="tree-title">
        <h2 id="tree-title">Query plan</h2>
        <div id="query-tree" class="query-tree">
          <div class="tree-placeholder">Дерево запроса появится после поиска</div>
        </div>
      </aside>
    </section>
  </main>
</body>
</html>
